    create_pairs: scripts/pipeline/04_LDSC_create_pairs_diseases.py
    ldsc_genetic_correlation: scripts/pipeline/05_LDSC_run_pairs_automatised.py
    hdl_genetic_correlation: scripts/pipeline/05_HDL_run_pairs_automatised.py
    supergnova_genetic_correlation: scripts/pipeline/05_SUPERGNOVA_run_pairs_automatised.py
    ldsc_SNP: scripts/pipeline/6A_ldsc_extract_SNPs.py
    ldsc_results_to_csv: scripts/pipeline/06_LDSC_extract_SNPs.py
    hdl_results_to_csv: scripts/pipeline/06_HDL_read_results_extract_gencor.py
  ldsc:
    ldsc_software: scripts/ldsc/ldsc.py
    ldsc_munge: scripts/ldsc/munge_sumstats.py
  GNOVA:
    gnova_software: scripts/GNOVA/gnova.py
    gnova_munge: scripts/GNOVA/munge_sumstats.py
  SUPERGNOVA:
    supergnova_software: scripts/SUPERGNOVA/supergnova.py
  HDL:
    HDL_software: scripts/HDL/HDL.run.R
    HDL_wrangler: scripts/HDL/HDL.data.wrangling.R

Results:
