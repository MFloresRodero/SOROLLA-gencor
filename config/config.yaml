    catalog_to_final_description: scripts/pipeline/01_from_excell_catalog_to_final_csv.py
    add_ncol: scripts/pipeline/02_add_Ncol.py
    automatised_munge_script: sscripts/pipeline/03_MUNGE_sumstats_from_csv.py
