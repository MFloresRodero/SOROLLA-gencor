  plink_gnova: 1000G_EUR_Phase3_plink/1000G.EUR.QC.@
  supergnova_bfile: 1000G_EUR_Phase3_plink/1000G.EUR.QC.@
  supergnova_partition: 1000G_EUR_Phase3_plink/data/partition/eur_chr@.bed

