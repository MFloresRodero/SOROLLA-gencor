name: genetic_correlation_pipeline

# Common configuration
SumStats:
  sumstats_folder: SumStats/
  raw_folder: SumStats/RAW/
  preprocessed_folder: SumStats/PREPROCESSED/
  preprocessed_saving_process: 0_checkpoints/
  munged_folder: SumStats/Munged/
  wrangled_folder: SumStats/Wrangled/
  wrangle_commands: SumStats/Wrangled/commands/
  raw_catalog: excell_sumstats_description.csv
  description_csv: final_sumstats_description.csv
  matrix_description: data_description_matrix.csv
  paired_data: paired_datasets.csv
  MR_data: MR_paired_datasets.csv
  gnova_paired: gnova_paired_datasets.csv
  supergnova_paired: supergnova_paired_datasets.csv

Scripts:
